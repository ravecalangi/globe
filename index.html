<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globe</title>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
  "three/examples/jsm/": "https://unpkg.com/three@0.143.0/examples/jsm/"
}}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{background:#04060f;overflow-x:hidden}
/* Lenis */
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto !important}
.lenis.lenis-stopped{overflow:hidden}
.planet-canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;pointer-events:none}
.page{position:relative;z-index:1}
/* Empty spacers: they only give the same scroll distance as the old sections (no text). */
#hero-spacer{height:100vh}
#indonesia{height:320vh}
#features{height:160vh}
#solutions{height:160vh}
#cta{height:100vh}
</style>
</head>
<body>

<canvas class="planet-canvas" id="planet"></canvas>

<div class="page" id="top">
  <div id="hero-spacer"></div>
  <div id="indonesia"></div>
  <div id="features"></div>
  <div id="solutions"></div>
  <div id="cta"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/examples/jsm/postprocessing/ShaderPass.js';
import { GammaCorrectionShader } from 'three/examples/jsm/shaders/GammaCorrectionShader.js';
import { CopyShader } from 'three/examples/jsm/shaders/CopyShader.js';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Lenis ---------- */
if (!reduceMotion) {
  import('https://unpkg.com/lenis@1.3.23/dist/lenis.mjs').then(({ default: Lenis }) => {
    const lenis = new Lenis({ duration: 1.15, smoothWheel: true, touchMultiplier: 1.5 });
    const raf = (t) => { lenis.raf(t); requestAnimationFrame(raf); };
    requestAnimationFrame(raf);
  }).catch(err => console.warn('Lenis failed to load', err));
}

/* ---------- assets ---------- */
const ASSET_BASE_URL = 'https://api.getlayers.ai/storage/v1/object/public/public/assets/ascend-d9857ad1f2';
const PLANET_GLB = ASSET_BASE_URL + '/planet.glb';
const PLANET_LIGHTS_GLB = ASSET_BASE_URL + '/planet-lights.glb';
const PLANET_CLOUDS_PNG = ASSET_BASE_URL + '/planet-clouds.png';

/* ---------- config ---------- */
const CONFIG = {
  rimColor:'#c1faff', rimPower:2.4, nightLights:10, terrainDepth:0.33, terrainShade:1.3,
  oceanGlint:0.45, oceanDeep:0.12, oceanFlow:3, oceanFlowSpeed:0.8, oceanFlowScale:2.1,
  glowColor:'#3a6cff', glowIntensity:3.35, planetRadius:1.95, spin:0.03, initRotation:2.07,
  tilt:0.37, autoRotate:0,
  cloud1Height:1.005, cloud1Opacity:0.6, cloud1Spin:0.06,
  cloud2Height:1.03, cloud2Opacity:0.5, cloud2Spin:0.14,
  cloud3Height:1.075, cloud3Opacity:0.5, cloud3Spin:0.1,
  bgColor:'#040a1e', flameColor:'#3a6cff', flameColor2:'#c1faff', flameAmt:0.15,
  atmoColor:'#9fc4ff', atmoCount:320, atmoSize:22, atmoSpeed:0.8,
  starColor:'#cfe0ff', starCount:1400, starSize:1.6, starFlicker:1,
  markerColor:'#ffd27a', markerCount:60, markerSize:16, markerSpeed:0.5,
};
const LAYERS = { NONE:0, TORUS_SCENE:1, BLOOM_SCENE:2, ENTIRE_SCENE:3 };

/* ===== INDONESIA ZOOM SETTINGS =====
   INDONESIA_ROT : planetGroup.rotation.y that puts Indonesia (~118°E) at the centre.
                   Indonesia off to the left -> increase it. Off to the right -> decrease it. (0.1 ≈ 5.7° longitude)
   ZOOM_SCALE    : globe size when fully zoomed (2.4 – 3.4)
   ZOOM_CAM_Z    : camera distance when fully zoomed (default camera z = 8, lower = closer)
   ZOOM_Y_OFFSET : nudge the zoomed globe up/down */
const INDONESIA_ROT = 2.65;
const ZOOM_SCALE = 2.6;
const ZOOM_CAM_Z = 6.4;
const ZOOM_Y_OFFSET = 0.0;

const zoomEl = document.getElementById('indonesia');
const featuresEl = document.getElementById('features');
const showcaseEl = document.getElementById('solutions');

const Lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const smooth = (t) => t * t * (3 - 2 * t);
const wrapPI = (a) => ((a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
function hexToVec3(hex) { const c = new THREE.Color(hex); return new THREE.Vector3(c.r, c.g, c.b); }
function sample(stops, p) {
  if (p <= stops[0].p) return stops[0].v;
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (p <= b.p) return Lerp(a.v, b.v, smooth((p - a.p) / (b.p - a.p)));
  }
  return stops[stops.length - 1].v;
}

const SNOISE = `
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + 1.0 * C.xxx; vec3 x2 = x0 - i2 + 2.0 * C.xxx; vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
  i = mod(i, 289.0);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 1.0/7.0; vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
  vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0; vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
`;

/* ---------- renderer / scene / camera ---------- */
const canvas = document.getElementById('planet');
let W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const CAM_Z_DEFAULT = 8;
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
camera.position.set(0, 0, CAM_Z_DEFAULT);
camera.layers.enable(LAYERS.TORUS_SCENE);
camera.layers.enable(LAYERS.BLOOM_SCENE);
camera.layers.enable(LAYERS.ENTIRE_SCENE);
scene.add(camera);

const ambient = new THREE.AmbientLight(0xffffff, 1.8);
ambient.layers.set(LAYERS.ENTIRE_SCENE);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(0, 10, 2);
dirLight.layers.set(LAYERS.ENTIRE_SCENE);
scene.add(dirLight);

const px = () => renderer.getPixelRatio();
const uRes = { value: new THREE.Vector2(W * px(), H * px()) };

/* ---------- final pass ---------- */
const blackTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1, THREE.RGBAFormat);
blackTex.needsUpdate = true;

const FinalPass = {
  uniforms: {
    iTime:{value:0}, tDiffuse:{value:null}, torusTexture:{value:null}, bloomTexture:{value:null}, haloTexture:{value:blackTex},
    uBg:{value:hexToVec3(CONFIG.bgColor)}, uFlameA:{value:hexToVec3(CONFIG.flameColor)},
    uFlameB:{value:hexToVec3(CONFIG.flameColor2)}, uFlameAmt:{value:CONFIG.flameAmt},
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
    uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
    varying vec2 vUv;
    vec3 warp3d(vec3 pos, float t){ float curv=.8,a=1.9,b=0.7; pos*=2.;
      pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
      pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
      pos.z+=curv*sin(t+a*pos.x)+t*b; pos.x+=curv*cos(t+a*pos.z);
      return 0.5+0.5*cos(pos.xyz+vec3(1,2,4)); }
    void main(){
      vec2 uv = 2.*vUv - 1.;
      vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime*1.5), vec3(1.5));
      vec3 flame = 1.5*uFlameA*w.x; flame*=w.y; flame += uFlameB*w.z;
      flame *= smoothstep(0.25, 1., abs(uv.y));
      float md = smoothstep(-0.7, 1., -uv.y*uv.x); flame *= md*md;
      vec3 bg = uBg * (1.0 - 0.4 * length(uv));
      vec3 halo = texture2D(haloTexture, vUv).xyz;
      gl_FragColor = vec4(bg + flame*uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
    }`,
};

/* ---------- composers ---------- */
const torusComposer = new EffectComposer(renderer);
torusComposer.renderToScreen = false;
torusComposer.addPass(new RenderPass(scene, camera));
torusComposer.addPass(new ShaderPass(GammaCorrectionShader));
torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.22, 0.2, 0));
torusComposer.addPass(new ShaderPass(CopyShader));

const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;
bloomComposer.addPass(new RenderPass(scene, camera));
bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.5, 0.6, 0));
bloomComposer.addPass(new ShaderPass(GammaCorrectionShader));

const finalPass = new ShaderPass(new THREE.ShaderMaterial({
  uniforms: THREE.UniformsUtils.clone(FinalPass.uniforms),
  vertexShader: FinalPass.vertexShader,
  fragmentShader: FinalPass.fragmentShader,
}), 'tDiffuse');
finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture;
finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture;
finalPass.uniforms.uBg.value = hexToVec3(CONFIG.bgColor);
finalPass.uniforms.uFlameA.value = hexToVec3(CONFIG.flameColor);
finalPass.uniforms.uFlameB.value = hexToVec3(CONFIG.flameColor2);
finalPass.uniforms.uFlameAmt.value = CONFIG.flameAmt;
finalPass.uniforms.haloTexture.value = blackTex;

const finalComposer = new EffectComposer(renderer);
finalComposer.addPass(new RenderPass(scene, camera));
finalComposer.addPass(finalPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.enabled = false;
controls.autoRotate = true;
controls.autoRotateSpeed = CONFIG.autoRotate;
controls.minDistance = 3.5;
controls.maxDistance = 16;
controls.target.set(0, 0, 0);

/* ---------- scroll keyframes (original globe path) ----------
   p = page stop index: 0 = hero, 1 = features, 2 = showcase, 3 = bottom (cta).
   The Indonesia zoom section sits between 0 and 1 and blends over these via curW. */
const STOPS_X = [{p:0,v:0},{p:1,v:-3.1},{p:2,v:3.2},{p:3,v:0}];
const STOPS_Y = [{p:0,v:-4.5},{p:1,v:0.55},{p:2,v:0.45},{p:3,v:0.15}];
const STOPS_S = [{p:0,v:2.15},{p:1,v:1.0},{p:2,v:0.92},{p:3,v:1.12}];

const STOP_IDX = [0, 0, 1, 2, 3];
function scrollToStopIndex(y, anchors) {
  if (y <= anchors[0]) return 0;
  for (let i = 0; i < anchors.length - 1; i++) {
    if (y <= anchors[i + 1]) {
      const span = anchors[i + 1] - anchors[i];
      const t = span > 0 ? (y - anchors[i]) / span : 1;
      return Lerp(STOP_IDX[i], STOP_IDX[i + 1], t);
    }
  }
  return STOP_IDX[STOP_IDX.length - 1];
}

/* ---------- groups ---------- */
const worldGroup = new THREE.Group();
worldGroup.position.set(STOPS_X[0].v, STOPS_Y[0].v, 0);
worldGroup.scale.setScalar(STOPS_S[0].v);
scene.add(worldGroup);

const planetGroup = new THREE.Group();
planetGroup.rotation.z = CONFIG.tilt;
worldGroup.add(planetGroup);

const cloudGroup = new THREE.Group();
cloudGroup.rotation.z = CONFIG.tilt;
cloudGroup.visible = false;
worldGroup.add(cloudGroup);

/* ---------- atmosphere halo ---------- */
const glowMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({
    transparent: true, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uGlow: { value: hexToVec3(CONFIG.glowColor) }, uIntensity: { value: CONFIG.glowIntensity } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec3 uGlow; uniform float uIntensity; varying vec2 vUv;
      void main(){
        float d = length(vUv - 0.5) * 2.0;
        float a = pow(clamp(1.0 - d, 0.0, 1.0), 2.2);
        gl_FragColor = vec4(uGlow * a * uIntensity, a);
      }`,
  })
);
glowMesh.scale.setScalar(CONFIG.planetRadius * 2.3);
glowMesh.layers.set(LAYERS.ENTIRE_SCENE);
glowMesh.visible = false;
worldGroup.add(glowMesh);

/* ---------- shared time ---------- */
const planetTime = { value: 0 };
const cloudTime = { value: 0 };
const starTime = { value: 0 };
const markerTime = { value: 0 };

/* ---------- clouds ---------- */
const cloudMeshes = [];
const cloudSpinKeys = [];
function buildClouds() {
  const tex = new THREE.TextureLoader().load(PLANET_CLOUDS_PNG);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(5, 5);
  const layers = [
    { h:'cloud1Height', o:'cloud1Opacity', s:'cloud1Spin', ry:0.0, phase:0.0 },
    { h:'cloud2Height', o:'cloud2Opacity', s:'cloud2Spin', ry:2.2, phase:13.0 },
    { h:'cloud3Height', o:'cloud3Opacity', s:'cloud3Spin', ry:4.3, phase:27.0 },
  ];
  layers.forEach(layer => {
    const geo = new THREE.SphereGeometry(CONFIG.planetRadius * CONFIG[layer.h], 64, 64);
    const mat = new THREE.MeshStandardMaterial({ map: tex, transparent: true, depthWrite: false });
    const uniforms = {
      uTime: cloudTime, noiseScale: { value: 20 }, uSpeedX: { value: 1 }, uSpeedY: { value: 2 }, uSpeedZ: { value: 2 },
      uOpacity: { value: CONFIG[layer.o] }, uPhase: { value: layer.phase },
    };
    mat.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, uniforms);
      shader.vertexShader = 'varying vec2 vCloudUv;\n' + shader.vertexShader.replace('void main() {', 'void main() {\n vCloudUv = uv;');
      shader.fragmentShader = `
        varying vec2 vCloudUv;
        uniform float uTime; uniform float noiseScale; uniform float uSpeedX; uniform float uSpeedY; uniform float uSpeedZ;
        uniform float uOpacity; uniform float uPhase;
        ${SNOISE}
      ` + shader.fragmentShader.replace('#include <dithering_fragment>', `
        #include <dithering_fragment>
        gl_FragColor.rgb = vec3(1.0);
        float cloudNoise = snoise(vec3(vCloudUv.x * noiseScale + uTime * uSpeedX + uPhase, vCloudUv.y * noiseScale - uTime * uSpeedY + uPhase, uTime * uSpeedZ + uPhase));
        float cloudNdv = max(dot(normalize(vNormal), normalize(vViewPosition)), 0.0);
        float cloudEdge = pow(1.0 - cloudNdv, 3.0);
        float cloudMod = mix(cloudNoise, 1.0, cloudEdge);
        float cloudNdl = dot(normalize(vNormal), normalize(vec3(-0.9, 0.18, 0.4)));
        float cloudDay = 1.0 - smoothstep(0.30, -0.30, cloudNdl) * 0.9;
        gl_FragColor.a *= cloudMod * uOpacity * cloudDay;
      `);
    };
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.y = layer.ry;
    mesh.renderOrder = 2;
    mesh.layers.set(LAYERS.ENTIRE_SCENE);
    cloudGroup.add(mesh);
    cloudMeshes.push(mesh);
    cloudSpinKeys.push(layer.s);
  });
}
buildClouds();

/* ---------- motes ---------- */
function buildMotes() {
  const n = CONFIG.atmoCount;
  const pos = new Float32Array(n * 3), size = new Float32Array(n), seed = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    pos[i*3] = Math.random()*2-1; pos[i*3+1] = Math.random()*2-1; pos[i*3+2] = Math.random()*2-1;
    size[i] = CONFIG.atmoSize * (0.4 + Math.random());
    seed[i] = Math.random() * 100;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    uniforms: { uTime: { value: 0 }, uRes, uColor: { value: hexToVec3(CONFIG.atmoColor) } },
    vertexShader: `
      attribute float size; attribute float seed; uniform float uTime; uniform vec2 uRes;
      varying float vA;
      vec3 warp(vec3 p, float t){ float c=0.9,a=1.9,b=0.02,s=0.05; p*=2.;
        p.x+=c*sin(s*t+a*p.y)+t*b; p.y+=c*cos(s*t+a*p.x); p.y+=c*sin(s*t+a*p.z)+t*b;
        p.z+=c*cos(s*t+a*p.y); p.z+=c*sin(s*t+a*p.x)+t*b; p.x+=c*cos(s*t+a*p.z);
        return cos(p+vec3(1,2,4)); }
      void main(){
        vec3 v = position*4.0 + warp(position, uTime)*1.2;
        vec4 mv = modelViewMatrix * vec4(v, 1.0);
        float r = length(v); float farF = 1.0 - smoothstep(5.0, 6.5, r); float nearF = smoothstep(0.0, 0.5, -mv.z);
        vA = farF * nearF;
        gl_PointSize = size * uRes.y / 900.0 / -mv.z; gl_PointSize = max(gl_PointSize, 1.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; varying float vA;
      void main(){ vec2 p = gl_PointCoord - 0.5; float l = length(p); if (l > 0.5) discard;
        float tex = smoothstep(0.5, 0.0, l); gl_FragColor = vec4(uColor * tex, tex * vA * 0.55); }`,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.layers.set(LAYERS.ENTIRE_SCENE);
  pts.layers.enable(LAYERS.BLOOM_SCENE);
  pts.onBeforeRender = () => {
    const t = performance.now() / 1000;
    mat.uniforms.uTime.value = t * CONFIG.atmoSpeed * 8;
    pts.position.copy(camera.position);
    finalPass.uniforms.iTime.value = t;
  };
  scene.add(pts);
}
buildMotes();

/* ---------- stars ---------- */
function buildStars() {
  const n = CONFIG.starCount;
  const pos = new Float32Array(n * 3), seed = new Float32Array(n), bright = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u*u);
    pos[i*3] = 90 * s * Math.cos(th); pos[i*3+1] = 90 * u; pos[i*3+2] = 90 * s * Math.sin(th);
    seed[i] = Math.random() * 100; bright[i] = 0.35 + Math.random() * 0.65;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
  geo.setAttribute('bright', new THREE.BufferAttribute(bright, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true,
    uniforms: { uTime: starTime, uSize: { value: CONFIG.starSize }, uFlicker: { value: CONFIG.starFlicker }, uColor: { value: hexToVec3(CONFIG.starColor) }, uRes },
    vertexShader: `
      attribute float seed; attribute float bright;
      uniform float uTime; uniform float uSize; uniform float uFlicker; uniform vec2 uRes;
      varying float vTw;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float tw = 0.6 + 0.4 * sin(uTime * uFlicker + seed);
        vTw = bright * tw;
        gl_PointSize = max(uSize * uRes.y / 900.0 * (90.0 / max(-mv.z, 1.0)), 1.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; varying float vTw;
      void main(){
        vec2 p = gl_PointCoord - 0.5; float l = length(p); if (l > 0.5) discard;
        float core = smoothstep(0.5, 0.0, l);
        gl_FragColor = vec4(uColor, core * vTw);
      }`,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.layers.set(LAYERS.ENTIRE_SCENE);
  scene.add(pts);
}
buildStars();

/* ---------- land markers ---------- */
function buildMarkers(mesh) {
  const geo = mesh.geometry;
  const pos = geo.attributes.position, uvA = geo.attributes.uv, idx = geo.index;
  if (!pos || !uvA) return;
  const triCount = idx ? idx.count / 3 : pos.count / 3;
  const vi = (t, k) => idx ? idx.getX(t * 3 + k) : t * 3 + k;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3();
  const cum = new Float32Array(triCount);
  let total = 0;
  for (let t = 0; t < triCount; t++) {
    A.fromBufferAttribute(pos, vi(t,0)); B.fromBufferAttribute(pos, vi(t,1)); C.fromBufferAttribute(pos, vi(t,2));
    ab.subVectors(B, A); ac.subVectors(C, A);
    total += ab.cross(ac).length() * 0.5;
    cum[t] = total;
  }
  let data = null, tw = 0, th = 0;
  try {
    const img = mesh.material.map && mesh.material.map.image;
    if (img) {
      tw = img.width; th = img.height;
      const cv = document.createElement('canvas'); cv.width = tw; cv.height = th;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      data = ctx.getImageData(0, 0, tw, th).data;
    }
  } catch (e) { data = null; }

  const out = [], seeds = [];
  let attempts = 0;
  const U0 = new THREE.Vector2(), U1 = new THREE.Vector2(), U2 = new THREE.Vector2();
  while (out.length < CONFIG.markerCount * 3 && attempts < 8000) {
    attempts++;
    const r = Math.random() * total;
    let lo = 0, hi = triCount - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < r) lo = m + 1; else hi = m; }
    const t = lo;
    let a = Math.random(), b = Math.random();
    if (a + b > 1) { a = 1 - a; b = 1 - b; }
    const c = 1 - a - b;
    A.fromBufferAttribute(pos, vi(t,0)); B.fromBufferAttribute(pos, vi(t,1)); C.fromBufferAttribute(pos, vi(t,2));
    U0.fromBufferAttribute(uvA, vi(t,0)); U1.fromBufferAttribute(uvA, vi(t,1)); U2.fromBufferAttribute(uvA, vi(t,2));
    const u = U0.x * c + U1.x * a + U2.x * b;
    const v = U0.y * c + U1.y * a + U2.y * b;
    if (data) {
      const x = clamp(Math.floor((((u % 1) + 1) % 1) * tw), 0, tw - 1);
      const y = clamp(Math.floor(clamp(v, 0, 1) * th), 0, th - 1);
      const o = (y * tw + x) * 4;
      const cr = data[o], cg = data[o+1], cb = data[o+2];
      if (cb > cr + 6 && cb > cg + 6) continue;
    }
    const p = new THREE.Vector3().addScaledVector(A, c).addScaledVector(B, a).addScaledVector(C, b).multiplyScalar(1.012);
    out.push(p.x, p.y, p.z);
    seeds.push(Math.random());
    if (seeds.length >= CONFIG.markerCount) break;
  }
  if (!seeds.length) return;
  const mg = new THREE.BufferGeometry();
  mg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(out.slice(0, seeds.length * 3)), 3));
  mg.setAttribute('seed', new THREE.BufferAttribute(new Float32Array(seeds), 1));
  const mm = new THREE.ShaderMaterial({
    transparent: true, blending: THREE.AdditiveBlending, depthTest: true, depthWrite: false,
    uniforms: { uTime: markerTime, uColor: { value: hexToVec3(CONFIG.markerColor) }, uSize: { value: CONFIG.markerSize }, uSpeed: { value: CONFIG.markerSpeed }, uRes },
    vertexShader: `
      attribute float seed; uniform float uSize; uniform vec2 uRes;
      varying float vSeed; varying float vFade;
      void main(){
        vSeed = seed;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vec3 vn = normalize(normalMatrix * normalize(position));
        vec3 vd = normalize(-mv.xyz);
        vFade = smoothstep(0.15, 0.5, dot(vn, vd));
        gl_PointSize = max(uSize * uRes.y / 900.0 * (7.0 / max(-mv.z, 1.0)), 2.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uTime; uniform float uSpeed;
      varying float vSeed; varying float vFade;
      void main(){
        if (vFade <= 0.001) discard;
        vec2 p = gl_PointCoord - 0.5;
        float d = length(p) * 2.0;
        if (d > 1.0) discard;
        float core = smoothstep(0.30, 0.0, d) * 1.2;
        float ph = fract(uTime * uSpeed + vSeed);
        float ring = smoothstep(0.07, 0.0, abs(d - ph)) * (1.0 - ph);
        gl_FragColor = vec4(uColor, clamp(core + ring, 0.0, 1.0) * vFade);
      }`,
  });
  const pts = new THREE.Points(mg, mm);
  pts.frustumCulled = false;
  pts.layers.set(LAYERS.ENTIRE_SCENE);
  pts.layers.enable(LAYERS.BLOOM_SCENE);
  mesh.add(pts);
}

/* ---------- planet ---------- */
let planetLoaded = false;
let entryStart = 0;
const ENTRY_DUR = 1.9, ENTRY_START_Y = -6.5;

function firstMesh(root) {
  let found = null;
  root.traverse(o => { if (!found && o.isMesh) found = o; });
  return found;
}
function markLoaded() {
  planetLoaded = true;
  entryStart = performance.now() / 1000;
  cloudGroup.visible = true;
  glowMesh.visible = true;
}

function applyPlanetMaterial(mesh, nightTex) {
  const mat = mesh.material.clone();
  mat.metalness = 0; mat.roughness = 1; mat.envMapIntensity = 0;
  const U = {
    time: planetTime, noiseScale: { value: 30 }, speedX: { value: 1.5 }, speedY: { value: 2.0 }, speedZ: { value: 2.5 },
    rimColor: { value: new THREE.Color(CONFIG.rimColor) }, rimPower: { value: CONFIG.rimPower },
    nightBlendTexture: { value: nightTex }, nightLights: { value: CONFIG.nightLights },
    terrainDepth: { value: CONFIG.terrainDepth }, terrainShade: { value: CONFIG.terrainShade },
    oceanGlint: { value: CONFIG.oceanGlint }, oceanDeep: { value: CONFIG.oceanDeep },
    oceanFlow: { value: CONFIG.oceanFlow }, oceanFlowSpeed: { value: CONFIG.oceanFlowSpeed }, oceanFlowScale: { value: CONFIG.oceanFlowScale },
  };
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = 'varying vec2 vCustomUv;\n' + shader.vertexShader.replace('void main() {', 'void main() {\n vCustomUv = uv;');
    shader.fragmentShader = `
      varying vec2 vCustomUv;
      uniform float time; uniform float noiseScale; uniform float speedX; uniform float speedY; uniform float speedZ;
      uniform vec3 rimColor; uniform float rimPower; uniform sampler2D nightBlendTexture; uniform float nightLights;
      uniform float terrainDepth; uniform float terrainShade; uniform float oceanGlint; uniform float oceanDeep;
      uniform float oceanFlow; uniform float oceanFlowSpeed; uniform float oceanFlowScale;
      ${SNOISE}
    ` + shader.fragmentShader.replace('#include <dithering_fragment>', `
      #include <dithering_fragment>
      vec3 normalizedNormal = normalize(vNormal);
      vec3 viewDir = normalize(vViewPosition);
      float rim = 1.0 - max(dot(viewDir, normalizedNormal), 0.0);
      rim = pow(rim, rimPower); rim = pow(rim, 1.5); rim *= 0.7;
      vec3 currentColor = gl_FragColor.rgb;
      float blueDom = currentColor.b - max(currentColor.r, currentColor.g);
      float waterMask = clamp(smoothstep(-0.005, 0.03, blueDom), 0.0, 1.0);
      float shimmer = snoise(vec3(vCustomUv.x * noiseScale + time * speedX, vCustomUv.y * noiseScale - time * speedY, time * speedZ));
      gl_FragColor.rgb += waterMask * shimmer * 0.025;
      float fT = time * oceanFlowSpeed * 4.0;
      float fS = 4.0 * oceanFlowScale;
      float warp = snoise(vec3(vCustomUv.x * fS - fT * 0.5, vCustomUv.y * fS + fT * 0.4, fT * 0.5));
      float flow = snoise(vec3(vCustomUv.x * fS * 2.0 + fT * 0.6 + warp, vCustomUv.y * fS * 2.0 - fT * 0.5, fT * 0.7));
      flow = warp * 0.6 + flow * 0.4;
      gl_FragColor.rgb += waterMask * flow * 0.12 * oceanFlow;
      gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.01, 0.06, 0.16), waterMask * oceanDeep);
      vec3 finalColor = mix(gl_FragColor.rgb, rimColor, rim);
      gl_FragColor = vec4(finalColor, 1.0);
      vec3 surfPos = -vViewPosition;
      float terrH = dot(texture2D(map, vCustomUv).rgb, vec3(0.299, 0.587, 0.114));
      vec3 sigX = dFdx(surfPos), sigY = dFdy(surfPos);
      vec3 vR1 = cross(sigY, normalizedNormal), vR2 = cross(normalizedNormal, sigX);
      float fDet = dot(sigX, vR1);
      vec3 vGrad = sign(fDet) * (dFdx(terrH) * vR1 + dFdy(terrH) * vR2);
      vec3 bumpedNormal = normalize(abs(fDet) * normalizedNormal - terrainDepth * vGrad);
      vec3 shadeNormal = mix(bumpedNormal, normalizedNormal, waterMask);
      vec3 cityLights = texture2D(nightBlendTexture, vCustomUv).rgb * gl_FragColor.rgb * nightLights;
      vec3 viewSunDir = normalize(vec3(-0.9, 0.18, 0.4));
      float ndl = dot(normalizedNormal, viewSunDir);
      float dayAmt = smoothstep(-0.05, 0.35, ndl);
      float relief = dot(shadeNormal, viewSunDir) - ndl;
      gl_FragColor.rgb *= clamp(1.0 + relief * terrainShade * dayAmt, 0.55, 1.6);
      float nightFactor  = smoothstep(0.18, -0.30, ndl);
      float lightsFactor = smoothstep(0.30, -0.35, ndl);
      gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * 0.08, nightFactor);
      gl_FragColor.rgb += cityLights * lightsFactor;
      vec3 halfDir = normalize(viewSunDir + viewDir);
      float ripple = snoise(vec3(vCustomUv * 240.0, time * 4.0));
      float ndh = max(dot(normalizedNormal, halfDir) + ripple * 0.02, 0.0);
      float glint = pow(ndh, 140.0);
      gl_FragColor.rgb += glint * waterMask * dayAmt * oceanGlint * vec3(1.0, 0.97, 0.88);
    `);
  };
  mesh.material = mat;
  mesh.layers.set(LAYERS.ENTIRE_SCENE);
}

const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.5/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(draco);
gltfLoader.setCrossOrigin('anonymous');

gltfLoader.load(PLANET_LIGHTS_GLB, (lightsGltf) => {
  const lm = firstMesh(lightsGltf.scene);
  const nightTex = lm && lm.material && lm.material.map ? lm.material.map : blackTex;
  gltfLoader.load(PLANET_GLB, (gltf) => {
    const mesh = firstMesh(gltf.scene);
    if (!mesh) { markLoaded(); return; }
    mesh.geometry.computeBoundingSphere();
    const s = CONFIG.planetRadius / mesh.geometry.boundingSphere.radius;
    mesh.scale.setScalar(s);
    applyPlanetMaterial(mesh, nightTex);
    planetGroup.add(mesh);
    try { buildMarkers(mesh); } catch (e) { console.warn('markers failed', e); }
    markLoaded();
  }, undefined, (e) => { console.warn('planet.glb failed', e); markLoaded(); });
}, undefined, (e) => { console.warn('planet-lights.glb failed', e); });

/* ---------- resize ---------- */
function onResize() {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(W, H, false);
  [torusComposer, bloomComposer, finalComposer].forEach(c => { c.setPixelRatio(window.devicePixelRatio); c.setSize(W, H); });
  uRes.value.set(W * px(), H * px());
}
window.addEventListener('resize', onResize);
onResize();

/* ---------- loop ---------- */
let last = performance.now() / 1000;
let curScroll = window.scrollY;
let curX = STOPS_X[0].v, curY = STOPS_Y[0].v, curS = STOPS_S[0].v;
let spinPhase = 0;
let curW = 0; // Indonesia zoom weight (0 = normal globe path, 1 = fully zoomed on Indonesia)

const absTop = (el, sy) => el.getBoundingClientRect().top + sy;

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000;
  const dt = Math.min(0.05, now - last); last = now;

  planetTime.value += dt / 12;
  cloudTime.value += dt / 20;
  starTime.value += dt;
  markerTime.value += dt;
  finalPass.uniforms.iTime.value = now;

  const vh = window.innerHeight;
  const sy = window.scrollY;
  const maxScroll = Math.max(1, document.documentElement.scrollHeight - vh);
  curScroll += (sy - curScroll) * Math.min(1, dt * 4.5);

  /* --- original globe path (hero → left → right → centre) using real section positions --- */
  const zoomTop = absTop(zoomEl, sy);
  const featMid = Math.max(absTop(featuresEl, sy) + featuresEl.offsetHeight / 2 - vh / 2, zoomTop + 1);
  const showMid = Math.max(absTop(showcaseEl, sy) + showcaseEl.offsetHeight / 2 - vh / 2, featMid + 1);
  const anchors = [0, zoomTop, featMid, showMid, Math.max(maxScroll, showMid + 1)];
  const idx = scrollToStopIndex(curScroll, anchors);

  const sideScale = clamp(window.innerWidth / 1200, 0.5, 1);
  const k = Math.min(1, dt * 3.2);
  curX += (sample(STOPS_X, idx) * sideScale - curX) * k;
  curY += (sample(STOPS_Y, idx) - curY) * k;
  curS += (sample(STOPS_S, idx) - curS) * k;

  /* --- Indonesia zoom weight from the #indonesia section --- */
  const zr = zoomEl.getBoundingClientRect();
  const enter = clamp((vh - zr.top) / vh, 0, 1);
  const exit  = clamp((vh - zr.bottom) / vh, 0, 1);
  const wTarget = smooth(enter) * (1 - smooth(exit));
  curW += (wTarget - curW) * Math.min(1, dt * 3);

  let entryY = 0;
  if (planetLoaded && !reduceMotion) {
    const t = clamp((now - entryStart) / ENTRY_DUR, 0, 1);
    entryY = ENTRY_START_Y * (1 - (1 - Math.pow(1 - t, 3)));
  }

  /* blend between the normal path and the zoomed, centred position */
  worldGroup.position.set(Lerp(curX, 0, curW), Lerp(curY, ZOOM_Y_OFFSET, curW) + entryY, 0);
  worldGroup.scale.setScalar(Lerp(curS, ZOOM_SCALE, curW));
  camera.position.z = Lerp(CAM_Z_DEFAULT, ZOOM_CAM_Z, smooth(curW));

  /* rotation: scroll-driven turn (original) + lock onto Indonesia while zoomed */
  spinPhase += dt * CONFIG.spin;
  const baseRot = CONFIG.initRotation + spinPhase + clamp(curScroll / maxScroll, 0, 1) * Math.PI * 1.6;
  planetGroup.rotation.y = baseRot + wrapPI(INDONESIA_ROT - baseRot) * curW;

  /* fade glow and clouds while zoomed so the land is clear */
  glowMesh.material.uniforms.uIntensity.value = CONFIG.glowIntensity * (1 - curW);
  cloudMeshes.forEach((m, i) => {
    m.material.opacity = 1 - curW * 0.8;
    m.rotation.y += dt * CONFIG[cloudSpinKeys[i]];
  });
  glowMesh.quaternion.copy(camera.quaternion);

  controls.update();
  camera.layers.set(LAYERS.TORUS_SCENE); torusComposer.render();
  camera.layers.set(LAYERS.BLOOM_SCENE); bloomComposer.render();
  camera.layers.set(LAYERS.ENTIRE_SCENE); finalComposer.render();
}
frame();
</script>
